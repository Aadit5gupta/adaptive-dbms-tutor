  stem: T1 writes X. T2 reads that uncommitted value and commits while T1 is still active. T1 subsequently
    aborts. Which conclusion follows?
  options:
  - text: The schedule violates recoverability because the dependent reader committed before its writer had committed.
    correct: true
  - text: The schedule is recoverable because T1's eventual abort releases its locks.
    correct: false
  - text: The schedule is cascadeless because both transactions finished.
    correct: false
  - text: The schedule is recoverable because T2 only read X.
    correct: false
  explanation: T2 already committed a result that depended on a value from T1, which then aborted. The recoverability
    rule requires the writer to commit first.
