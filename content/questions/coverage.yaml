  stem: A transaction has released its first lock. It then acquires a new lock on an item it has not yet locked.
    Does this satisfy basic two-phase locking?
  options:
  - text: Yes, if the new lock is shared.
    correct: false
  - text: Yes, if the new lock is on a different item.
    correct: false
  - text: No. After the first release, the transaction cannot acquire a new lock.
    correct: true
  - text: Yes, provided the transaction will release all locks before it ends.
    correct: false
  explanation: The first lock release starts the shrinking phase. Acquiring a new lock after that point violates
    the protocol.
