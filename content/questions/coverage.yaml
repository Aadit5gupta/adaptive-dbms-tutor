    reproduced_book_text: false
  stem: Given W1(A), R2(A), R1(B), W2(B), what does the conflict graph say? W means write, R means read, and
    the number identifies the transaction.
  options:
  - text: It has only T2 → T1, so T2 must come first.
    correct: false
  - text: It has a cycle because there are conflicts on two items.
    correct: false
  - text: It has no edges because each transaction touches two items.
    correct: false
  - text: It has only T1 → T2, so the schedule is conflict-serializable.
    correct: true
  explanation: The write of A by T1 precedes T2's read, and T1's read of B precedes T2's write. Both conflicts
    point from T1 to T2.
