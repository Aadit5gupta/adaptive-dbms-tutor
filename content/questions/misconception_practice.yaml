- id: q_progress_fds_closure_missing
  version: 1
  type: mcq
  pool: practice
  difficulty: medium
  stem: For R(A, B, C, D, E), assume A → B, B → C and (C, D) → E, plus their implications. What is the closure of
    {A}?
  options:
  - text: '{A, B}'
    correct: false
  - text: '{A, B, C, E}'
    correct: false
  - text: '{A, B, C, D, E}'
