- id: q_lean_keys_alternate_parent
  version: 1
  type: mcq
  pool: practice
  difficulty: medium
  stem: In SQLite, Building has id as its primary key and registry_code as NOT NULL with neither a UNIQUE constraint
    nor a unique index. A data check found that all current registry codes differ. Every Inspection row must store
    a NOT NULL reference to Building.registry_code, and several inspections may share a registry code. What schema
    change makes that foreign key valid and enforces these rules for future rows?
  options:
  - text: Add an ordinary index on Building.registry_code and reference it.
    correct: false
  - text: Add UNIQUE to Inspection.registry_code and reference the building column as it stands.
    correct: false
  - text: Add UNIQUE to Building.registry_code and reference it from Inspection without adding child uniqueness.
    correct: true
  - text: Use the current data check in place of a parent constraint.
    correct: false
  explanation: SQLite requires a non-primary parent key to be covered by a compatible UNIQUE constraint or index.
    Adding parent uniqueness protects future rows and leaves multiple child inspections allowed.
