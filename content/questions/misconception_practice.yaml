  - text: Alarm(alarm_id, device_id), Device(device_id, model_id), and Model(model_id, alert_tone).
    correct: true
  - text: Alarm(alarm_id, alert_tone), Device(device_id, model_id), and Model(model_id, alert_tone).
    correct: false
  - text: Alarm(alarm_id, device_id), Device(device_id, alert_tone), and Model(model_id, alert_tone).
