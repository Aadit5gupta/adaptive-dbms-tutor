- id: q_norm_practice_bcnf_counterexample
  version: 1
  type: mcq
  pool: practice
  difficulty: hard
  stem: Training(trainee, lab, supervisor) is in 1NF. The only nontrivial dependencies that need to be assumed are
    (trainee, lab) → supervisor and supervisor → lab, plus what they imply. Its candidate keys are (trainee, lab)
    and (trainee, supervisor). Which statement holds?
  options:
  - text: It violates 2NF because supervisor is part of a candidate key.
    correct: false
  - text: It violates 3NF because supervisor is not a superkey and lab is non-prime.
    correct: false
  - text: It satisfies 3NF because lab is prime, but violates BCNF because supervisor is not a superkey.
    correct: true
  - text: It satisfies BCNF because lab appears in a candidate key.
    correct: false
  explanation: Lab belongs to a candidate key, so supervisor → lab meets 3NF's prime-attribute exception. BCNF requires
    a superkey determinant for every nontrivial FD; supervisor cannot determine trainee.
