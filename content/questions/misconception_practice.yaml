  stem: With one row per alarm, Alarm(alarm_id, device_id, model_id, alert_tone) has only candidate key alarm_id
    and dependencies alarm_id → device_id, device_id → model_id, and model_id → alert_tone. Which split keeps each
    fact at its immediate determinant and can recover each alarm's alert tone?
  options:
