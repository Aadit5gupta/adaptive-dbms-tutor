- id: q_norm_practice_qualify_normal_form
  version: 1
  type: mcq
  pool: practice
  difficulty: medium
  stem: A 1NF table Meter(meter_id, model, accuracy_class) has only candidate key meter_id. It has model → accuracy_class,
    model is not a superkey, and accuracy_class is non-key. Other dependencies follow only from these facts. What
    is its highest normal form among 1NF, 2NF, 3NF and BCNF?
  options:
  - text: 1NF, because any non-key column means a 2NF violation.
    correct: false
  - text: 3NF, because meter_id is already a key.
    correct: false
  - text: BCNF, because a single-column key determines the table.
    correct: false
  - text: 2NF, because there is no partial dependency, but model → accuracy_class violates 3NF.
    correct: true
  explanation: There is no partial dependency on the one-column key under the stated dependencies. The non-key determinant
    model fixes another non-key attribute and is not a superkey, ruling out 3NF and BCNF.
