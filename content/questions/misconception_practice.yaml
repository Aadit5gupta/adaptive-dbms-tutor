- id: q_progress_agg_multiplication_before_sum
  version: 1
  type: mcq
  pool: practice
  difficulty: hard
  stem: A single SupportCase row has two Charge rows with amounts 5 and 7, and three Log rows. A report joins both
    child tables to SupportCase by case_id before calculating SUM(Charge.amount) for the case. Which pair gives
    the current result and a correction that still works if charges may share amounts?
  options:
  - text: 36; aggregate charges to one sum per case before joining logs, and report that sum once per case.
    correct: true
  - text: 12; keep the existing query because SUM ignores duplicates.
    correct: false
  - text: 36; use SUM(DISTINCT Charge.amount) on the original joined rows.
    correct: false
  - text: 36; divide the joined sum by the number of charge rows.
