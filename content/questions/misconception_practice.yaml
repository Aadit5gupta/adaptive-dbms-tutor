- id: q_norm_practice_lossless_bcnf_choice
  version: 1
  type: mcq
  pool: practice
  difficulty: hard
  stem: 'An equipment register has Device(D, M, R, P), where D is device ID, M model ID, R power rating and P purchase
    date. It is in 1NF, with only these dependencies and their implications: D → M, M → R, D → P. Which split is
    lossless, preserves all three stated dependencies without a join, and puts both relations in BCNF?'
  options:
  - text: (D, M, P) and (M, R).
    correct: true
  - text: (D, M, P) and (D, R).
    correct: false
  - text: (D, M, R) and (D, P).
    correct: false
  - text: (D, P) and (M, R).
    correct: false
  explanation: The shared M determines (M, R), so the join is lossless. D is the first relation's key and M the
    second's, and every stated dependency appears in a component. The second option omits M → R from both components.
    The third keeps a BCNF violation and the fourth has no shared attribute.
