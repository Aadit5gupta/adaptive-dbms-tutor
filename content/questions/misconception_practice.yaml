    key determines procedure_id, procedure_id determines procedure_note, and neither single key column determines
    procedure_id or procedure_note. The lab, procedure and note columns are non-key. Which classification of lab_id
    and procedure_note explains their dependence on the key?
  options:
  - text: lab_id is transitive; procedure_note is partial.
    correct: false
    misconception_code: NORM-03
  - text: Both are partial because the key is composite.
    correct: false
  - text: lab_id is partial; procedure_note is transitive through procedure_id.
    correct: true
  - text: Both are full and neither has a dependency through another attribute.
    correct: false
  explanation: The proper subset instrument_id already fixes lab_id. For procedure_note, the full key first determines
    the non-key procedure_id, and that procedure determines the note. The stem rules out any proper-subset determinant
    for the note.
  subtopic_id: normalization.normal_forms
