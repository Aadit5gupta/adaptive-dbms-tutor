- id: q_join_detector_routes
  version: 1
  type: mcq
  pool: diagnostic
  difficulty: easy
  stem: A report must list every route even if Departures is empty. When departure data exists, show only departures
    that match the route ID. Routes is the left table. Which join guarantees this?
  explanation: A LEFT JOIN preserves route rows that have no matching departure.
  options:
  - text: INNER JOIN Departures on the route ID.
    correct: false
    misconception_code: SQL-JOIN-01
  - text: LEFT JOIN Departures on the route ID.
    correct: true
  - text: CROSS JOIN Departures.
    correct: false
  - text: INNER JOIN Departures on equal departure times.
    correct: false
  subtopic_id: sql.joins
  review_status: ai_verified
  ai_assisted: true
  source:
