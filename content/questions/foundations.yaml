- id: q_keys_detector_tickets
  version: 1
  type: mcq
  pool: diagnostic
  difficulty: easy
  stem: Tickets.account_id is an enforced foreign key to Accounts.id. It has no uniqueness constraint. Account
    9 exists and account 10 does not. Which insertion satisfies the foreign key?
  explanation: Both tickets can reference account 9. The foreign key checks for a parent; it does not prohibit
    repeating the child value.
  options:
  - text: Two distinct tickets that both reference account 9.
    correct: true
  - text: Only one ticket can reference account 9 because the foreign key makes Tickets.account_id unique.
    correct: false
    misconception_code: KEYS-02
  - text: A ticket referencing nonexistent account 10.
    correct: false
  - text: Two new tickets that both reference account 10.
    correct: false
  subtopic_id: relational.keys
  review_status: ai_verified
  ai_assisted: true
  source:
    kind: authored
    factual_reference_url: https://runestone.academy/ns/books/published/practical_db/PART1_SQL/07-constraints/constraints.html
  author: Adaptive DBMS Tutor (AI-assisted)
  verified_on: '2026-11-23'
  second_review: false
