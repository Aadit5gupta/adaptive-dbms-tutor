- id: q_keys_checkpoint_badges
  version: 1
  type: mcq
  pool: checkpoint
  difficulty: easy
  stem: Badge.issue_office is a nullable, enforced foreign key to Office.id with no uniqueness constraint on the
    child column. One badge already references office 2. Office 2 exists and office 7 does not. Three new badges have distinct IDs
    and issue_office values 2, NULL, and 7. If inserted individually, which are accepted?
  explanation: A nullable single-column foreign key accepts NULL. A second reference to office 2 is also valid
    because the parent exists and the child column has no uniqueness constraint.
  options:
  - text: All three are accepted.
    correct: false
  - text: Only the badge with NULL is accepted.
    correct: false
  - text: Only the badge referencing office 2 is accepted.
    correct: false
  - text: The badges with NULL and office 2 are accepted.
    correct: true
