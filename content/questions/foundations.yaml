    primary_reviewer: ai:codex_primary
    independent_reviewer: ai:codex_separate_context
- id: q_keys_detector_members
  version: 1
  type: mcq
  pool: practice
  difficulty: easy
  stem: Members.club_id references Clubs.id. Clubs 22 and 23 exist. Two different members already have club_id
    22. What does the foreign key tell you about these rows?
  explanation: The constraint requires a matching club for each non-null reference. Repetition in Members is allowed
    unless a separate constraint forbids it.
  options:
  - text: Any positive club ID is valid even if no matching club exists.
    correct: false
  - text: The constraint is satisfied only when the club ID also equals the member ID.
    correct: false
  - text: Both references to club 22 are valid. A non-null reference to a missing club would be invalid.
    correct: true
  - text: Those two member rows violate the foreign key because club 22 appears twice in Members.
    correct: false
    misconception_code: KEYS-02
  subtopic_id: relational.keys
  review_status: ai_verified
