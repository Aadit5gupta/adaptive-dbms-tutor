- id: sql_matched_customers
  version: 1
  type: sql
  pool: practice
  subtopic_id: sql.joins
  difficulty: medium
  review_status: ai_verified
  ai_assisted: true
  dialect: sqlite
  min_sqlite_version: '3.35'
  prompt: |-
    Return the ID and name of each customer with at least one order. Return each customer once.
    Tables: customers(id, name) and orders(id, customer_id).
  visible_fixture: content/sql_fixtures/shop_visible.sql
  hidden_fixtures:
  - content/sql_fixtures/shop_hidden_a.sql
  - content/sql_fixtures/shop_hidden_b.sql
  reference_query: SELECT c.id, c.name FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id
    = c.id)
  compare:
    order_sensitive: false
    duplicate_sensitive: true
    column_names_matter: false
  expected_results:
  - fixture: content/sql_fixtures/shop_visible.sql
    expected_result_file: tests/fixtures/expected/matched_customers_shop_visible.json
  - fixture: content/sql_fixtures/shop_hidden_a.sql
    expected_result_file: tests/fixtures/expected/matched_customers_shop_hidden_a.json
  - fixture: content/sql_fixtures/shop_hidden_b.sql
    expected_result_file: tests/fixtures/expected/matched_customers_shop_hidden_b.json
  source:
