- id: sql_repeat_customers
  version: 1
  type: sql
  pool: practice
  subtopic_id: sql.aggregation
  difficulty: medium
  review_status: ai_verified
  ai_assisted: true
  dialect: sqlite
  min_sqlite_version: '3.35'
  prompt: |-
    Return customer IDs and order counts for customers with at least two orders. Exclude orders without a customer.
    Tables: customers(id, name) and orders(id, customer_id).
  visible_fixture: content/sql_fixtures/shop_visible.sql
  hidden_fixtures:
  - content/sql_fixtures/shop_hidden_a.sql
  - content/sql_fixtures/shop_hidden_b.sql
  reference_query: SELECT customer_id, COUNT(*) FROM orders WHERE customer_id IS NOT NULL GROUP BY customer_id
    HAVING COUNT(*) >= 2
  compare:
    order_sensitive: false
    duplicate_sensitive: true
    column_names_matter: false
  expected_results:
