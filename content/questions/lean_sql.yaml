    expected_result_file: tests/fixtures/expected/repeat_customers_shop_visible.json
  - fixture: content/sql_fixtures/shop_hidden_a.sql
    expected_result_file: tests/fixtures/expected/repeat_customers_shop_hidden_a.json
  - fixture: content/sql_fixtures/shop_hidden_b.sql
