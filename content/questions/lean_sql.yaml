  pool: practice
  subtopic_id: sql.ordering
  difficulty: easy
  review_status: ai_verified
  ai_assisted: true
  dialect: sqlite
  min_sqlite_version: '3.35'
  prompt: |-
    Return customer IDs and names in descending order of customer ID.
    Tables: customers(id, name) and orders(id, customer_id).
