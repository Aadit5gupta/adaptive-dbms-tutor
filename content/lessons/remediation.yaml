- id: lesson_join_unmatched
  version: 1
  subtopic_id: sql.joins
  review_status: ai_verified
  ai_assisted: true
  title: Keep unmatched rows with LEFT JOIN
  source:
    kind: authored
    factual_reference_url: https://runestone.academy/ns/books/published/practical_db/PART1_SQL/04-multiple-tables/multiple-tables.html
  body_markdown: |
    Suppose a library report needs every branch, even branches without loans
    today. Put the branches on the left of a LEFT JOIN to the qualifying loans.

    | branch | matching loan |
    | --- | --- |
    | North | 12 |
    | South | NULL |

    The missing loan columns are NULL for South. An INNER JOIN returns only
    matched pairs. Grouping by the branch key, COUNT(loan.id) gives South zero
    because its loan ID is NULL. COUNT(*) gives one because it counts the
    preserved output row.

    **Practice:** Try the reserved JOIN checkpoints after this lesson.
