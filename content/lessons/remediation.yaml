- id: lesson_fk_multiplicity
  version: 1
  subtopic_id: relational.keys
  review_status: ai_verified
  ai_assisted: true
  title: One parent, many child rows
  source:
    kind: authored
    factual_reference_url: https://runestone.academy/ns/books/published/practical_db/PART1_SQL/07-constraints/constraints.html
  body_markdown: |
    An enforced, single-column foreign key requires every non-null reference to
    have a matching parent. Several child rows can point to the same parent.

    | maintenance_job.id | maintenance_job.machine_id |
    | --- | --- |
    | 401 | 7 |
    | 402 | 7 |

    If machine 7 exists, both jobs can reference it. An explicit UNIQUE
    constraint on maintenance_job.machine_id would limit each non-null machine ID
    to one job. Ask whether a rule checks existence in another table or
    repetition within the current table.

    **Practice:** Try the reserved foreign-key checkpoints after this lesson.
