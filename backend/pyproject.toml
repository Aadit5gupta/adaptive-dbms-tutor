[project]
name = "adaptive-dbms-tutor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23,<27",
    "email-validator>=2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "PyYAML>=6,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1,<3",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "types-PyYAML",
]

[tool.pytest.ini_options]
pythonpath = ["..", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
