[project]
name = "adaptive-dbms-tutor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1,<3",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "types-PyYAML",
]

[tool.pytest.ini_options]
pythonpath = ["..", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
